name: Registry lint

on:
  pull_request:
    branches: [master, codex/380-codex-planner-workflow]
    paths:
      - 'apps/skill-registry/**'
      - '.github/workflows/registry-lint.yml'

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/skill-registry
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/skill-registry/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test:lint
